apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay — single GPU node, 2 API replicas, 1 worker replica.

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: skymaster-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: skymaster-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

configMapGenerator:
  - name: skymaster-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - LOG_LEVEL=INFO
