apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay — minikube / kind, no GPU. Uses NoOp executor via env.

resources:
  - ../../base

patches:
  # 1 API replica, no GPU nodeSelector on workers
  - target:
      kind: Deployment
      name: skymaster-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: skymaster-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      # Strip GPU resource in dev — falls back to CPU stub executor
      - op: remove
        path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu

configMapGenerator:
  - name: skymaster-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=DEBUG
      - EXECUTOR_KIND=noop
