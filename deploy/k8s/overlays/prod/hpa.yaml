---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skymaster-api
  namespace: skymaster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skymaster-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300     # avoid flapping
    scaleUp:
      stabilizationWindowSeconds: 30      # fast burst response
# NOTE: Worker HPA lives elsewhere — GPU workers should scale on a
# custom Prometheus metric ``skymaster_scene_job_queue_depth`` fed
# through prometheus-adapter, not on CPU. That's out of scope for the
# base chart and left for cluster operators.
