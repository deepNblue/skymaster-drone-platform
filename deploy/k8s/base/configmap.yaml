apiVersion: v1
kind: ConfigMap
metadata:
  name: skymaster-config
  namespace: skymaster
data:
  # Server
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_PORT: "8000"
  # Database
  POSTGRES_HOST: "skymaster-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "skymaster"
  POSTGRES_USER: "skymaster"
  # Redis (hot cache only — job queue is in Postgres)
  REDIS_HOST: "skymaster-redis"
  REDIS_PORT: "6379"
  # MinIO / S3
  S3_ENDPOINT: "http://skymaster-minio:9000"
  S3_BUCKET: "skymaster"
  S3_REGION: "us-east-1"
  # Job queue tuning
  JOB_LEASE_SECONDS: "300"
  JOB_MAX_ATTEMPTS: "3"
  JOB_JANITOR_INTERVAL_SECONDS: "30"
