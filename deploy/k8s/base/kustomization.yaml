apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skymaster

commonLabels:
  app.kubernetes.io/part-of: skymaster
  app.kubernetes.io/version: v2.1.0

resources:
  - namespace.yaml
  - configmap.yaml
  # NOTE: secret.yaml is git-ignored. Copy secret.example.yaml → secret.yaml
  # and fill in values, then uncomment the line below.
  # - secret.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - minio-statefulset.yaml
  - services.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - ingress.yaml
