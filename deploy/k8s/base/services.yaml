---
apiVersion: v1
kind: Service
metadata:
  name: skymaster-api
  namespace: skymaster
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skymaster-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: skymaster-postgres
  namespace: skymaster
spec:
  type: ClusterIP
  clusterIP: None   # headless — StatefulSet
  selector:
    app.kubernetes.io/name: skymaster-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: skymaster-redis
  namespace: skymaster
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skymaster-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: skymaster-minio
  namespace: skymaster
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skymaster-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
