# ⚠️ TEMPLATE — copy to `secret.yaml` and fill in.
# `secret.yaml` is git-ignored to prevent accidental leak.
apiVersion: v1
kind: Secret
metadata:
  name: skymaster-secret
  namespace: skymaster
type: Opaque
stringData:
  # 生成方式：openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME_32_BYTES_HEX"
  # 生成方式：openssl rand -hex 24
  # 该 token 由 GPU worker pod 在 X-Worker-Token 请求头中携带，用于 /_worker/* endpoints 鉴权
  SKYMASTER_WORKER_TOKEN: "CHANGE_ME_WORKER_TOKEN"
  # Postgres 密码
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  # MinIO/S3 credentials
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "CHANGE_ME_STRONG_MINIO_SECRET"
  # 火山引擎 Ark API（Copilot Agent、Vision AI 用）
  VOLCENGINE_API_KEY: "OPTIONAL_LEAVE_BLANK_IF_UNUSED"
