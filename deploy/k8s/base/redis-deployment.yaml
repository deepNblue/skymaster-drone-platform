---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skymaster-redis
  namespace: skymaster
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skymaster-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skymaster-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
