---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skymaster-api
  namespace: skymaster
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"  # chunk uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # WebSocket support (video streams, telemetry)
    nginx.ingress.kubernetes.io/proxy-set-headers: "|Upgrade $http_upgrade|Connection Upgrade"
    # cert-manager (prod overlay)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # tls:                        # enable in prod overlay
  #   - hosts:
  #       - skymaster.example.com
  #     secretName: skymaster-tls
  rules:
    - host: skymaster.local     # override per env
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skymaster-api
                port:
                  number: 8000
