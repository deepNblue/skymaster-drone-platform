name: Backend CI (v2.1 T1.5)

on:
  push:
    branches: [main, "v2.1-*"]
    paths:
      - "backend-v0.1/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend-v0.1/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-v0.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e . || true
          pip install pytest pytest-asyncio httpx

      - name: Run pytest
        run: pytest -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend-v0.1
          file: backend-v0.1/Dockerfile
          push: false
          tags: skymaster-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on HIGH+)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: skymaster-backend:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-v0.1/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: PLY/Splat parser tests
        run: bash tests/run-ply-tests.sh
