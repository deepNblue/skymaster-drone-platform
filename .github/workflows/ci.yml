name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-v0.1
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check app/ || true

      - name: Run tests
        env:
          USE_FAKE_REDIS: "true"
          JWT_SECRET: "ci-test-secret"
          AUDIT_MEMORY_SINK: "true"
          UOM_AUTO_APPROVE: "false"
          ENABLE_MISSION_WATCHER: "false"
          ENABLE_TRAJECTORY_STORE: "false"
        run: |
          pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v0.1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-v0.1/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Copilot tool-policy tests (F4.4)
        run: bash tests/run-tool-policy-tests.sh
      - name: Copilot memory tests (E2.3)
        run: bash tests/run-memory-tests.sh
      - name: Copilot approval-policy tests (E2.5)
        run: bash tests/run-approval-policy-tests.sh
      - name: Copilot marketplace tests (E2.6)
        run: bash tests/run-marketplace-tests.sh

      - name: Build (non-blocking on Cesium asset resolution)
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  compliance-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-v0.1
    needs: [backend]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run compliance-integration + metrics tests
        env:
          USE_FAKE_REDIS: "true"
          AUDIT_MEMORY_SINK: "true"
          UOM_AUTO_APPROVE: "false"
          ENABLE_MISSION_WATCHER: "false"
        run: |
          pytest tests/test_compliance_integration.py tests/test_metrics.py tests/test_uom.py tests/test_geofence.py tests/test_audit_middleware.py tests/test_rbac.py -q
